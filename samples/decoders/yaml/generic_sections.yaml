# Reusable length-delimited sections. IDs and structures belong to this definition.
# The first section contains descriptions; a later section uses the resulting type.
# Synthetic example bytes are described in generic_structures.md.
endian: little
structures:
  Description:
    fields:
      - {name: name, type: text, length: 4}
      - {name: format, type: u8}
      - {name: count, type: u8}
  Definitions:
    fields:
      - {name: entries, type: Description, repeat: until end}
    actions:
      - define:
          name: Discovered
          from: entries
          fields:
            name: {ref: name}
            type:
              ref: format
              cases: {'1': u16, '2': i16, '3': f32}
            repeat: {ref: count}
  Section:
    fields:
      - {name: id, type: u8}
      - {name: length, type: u8}
      - name: payload
        type:
          choose:
            ref: id
            cases: {'1': Definitions, '2': Discovered}
            otherwise: bytes
        length: {ref: length}
actions:
  - read: {name: sections, type: Section, repeat: until end}
