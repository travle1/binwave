# PWAV waveform fixture, version 1: a generic synthetic tagged container.
# The reusable parser discovers numeric fields from descriptors in the file.
# Generate matching data with samples/generators/generate_waveform_stress.rs.
# Section IDs, names, and numeric formats come from this decoder and the file.
endian: little
structures:
  - name: Header
    fields:
      - {name: signature, type: string, length: 4, expect: PWAV}
      - {name: version, type: u32, expect: 1}
      - {name: file_bytes, type: u64}
      - {name: sample_count, type: u64}
      - {name: section_count, type: u32}
      - {name: descriptor_count, type: u32}

  - name: Field
    fields:
      - {name: name, type: string, length: 16}
      - {name: format, type: u32}
      - {name: byte_width, type: u32}

  - name: RecordType
    fields:
      - name: entries
        type: {structure: Field}
        repeat: {ref: /header.descriptor_count}
    actions:
      - define:
          name: Sample
          from: entries
          fields:
            name: {ref: name}
            type:
              ref: format
              cases: {'1': u64, '2': i64, '3': f64, '4': f32, '5': u32, '6': i32}
            length: {ref: byte_width}

  - name: Samples
    fields:
      # The region belongs to this whole collection; each dynamically defined
      # Sample consumes 64 bytes. Even a 40 GB collection stays deferred.
      - {name: records, type: {structure: Sample}, repeat: until end}

  - name: Footer
    fields:
      - {name: marker, type: string, length: 8, expect: PWAV-END}
      - {name: sample_count, type: u64}
      - {name: payload_bytes, type: u64}
      - {name: sample_offset, type: u64}
      - {name: final_index, type: u64}
      - {name: generator_seed, type: u64}

  - name: Section
    fields:
      - {name: id, type: u32}
      - {name: flags, type: u32}
      - {name: payload_bytes, type: u64}
      - name: payload
        type:
          choose:
            ref: id
            cases: {'1': {structure: RecordType}, '2': {structure: Samples}, '3': {structure: Footer}}
            otherwise: bytes
        length: {ref: payload_bytes}

actions:
  - read: {name: header, type: {structure: Header}}
  - read: {name: sections, type: {structure: Section}, repeat: {ref: /header.section_count}}
