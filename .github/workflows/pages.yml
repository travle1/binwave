name: Publish browser app to GitHub Pages

# Publishing is deliberate; ordinary commits do not deploy the public website.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser file and decoder handling
        run: |
          node tests/browser_backend.mjs
          node tests/browser_startup.mjs
          node tests/browser_decoder_worker.mjs
      - run: cargo install --locked trunk --version 0.21.14
      # Relative URLs support the /binwave/ project path, including worker imports.
      - run: trunk build --release --locked
      - name: Validate generated WASM and bundled demo
        run: node --experimental-default-type=module tests/browser_decoder.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
