name: Platform builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev
      - run: cargo test --locked
      - name: Build Windows portable package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Binwave-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/browser_backend.mjs tests/browser_startup.mjs tests/browser_decoder_worker.mjs
      - run: cargo install --locked trunk --version 0.21.14
      - run: trunk build --release --locked
      - run: node --experimental-default-type=module tests/browser_decoder.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Binwave-browser-preview
          path: dist/web
