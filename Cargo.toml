[package]
name = "plotter_max"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.27", default-features = true, features = ["default_fonts", "wgpu", "persistence"] }
egui = "0.27"
egui_plot = "0.27"
egui_dock = { version = "0.12", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
csv = "1.3"
anyhow = "1"
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
rfd = "0.15.4"
serde_yaml_ng = "0.10"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
memmap2 = "0.9"
tempfile = "3"
bytemuck = "1"
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
