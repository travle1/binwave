[package]
name = "plotter_max"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.27", default-features = true, features = ["default_fonts", "wgpu"] }
egui = "0.27"
egui_plot = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
anyhow = "1"
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
rfd = "0.14"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
