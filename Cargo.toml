[package]
name = "binwave"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
egui = "0.27"
egui_plot = "0.27"
egui_dock = { version = "0.12", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
csv = "1.3"
anyhow = "1"
log = "0.4"
serde_yaml_ng = "0.10"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
bytemuck = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.27", default-features = true, features = ["default_fonts", "wgpu", "persistence"] }
rayon = "1.10"
env_logger = "0.11"
rfd = "0.15.4"
memmap2 = "0.9"
tempfile = "3"
libc = "0.2"
same-file = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
wgpu = { version = "0.19", default-features = false, features = ["webgpu", "webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-time = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
